[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "geoda"
description = "Analisis y mineria de datos con nucleo en Rust"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
keywords = ["data-science", "statistics", "data-mining", "rust"]
classifiers = [
    # PyPI rechaza cualquier subida con esta clasificacion: quitarla a proposito al publicar (RELEASING.md).
    "Private :: Do Not Upload",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ElYares/geoda"

[tool.maturin]
# `_geoda` = `lib.name` de Cargo.toml, dentro del paquete `geoda`.
module-name = "geoda._geoda"
python-source = "python"
# La wheel solo lleva el paquete: ni cache de bytecode ni archivos de prueba.
exclude = ["**/__pycache__/**", "**/*.pyc", "tests/**"]
# El SBOM generado por maturin guarda la ruta absoluta del checkout (`file:///home/...`).
sbom = { rust = false, auditwheel = false }
