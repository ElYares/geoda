[package]
name = "geoda-py"
description = "Binding de Python para geoda (PyO3 sobre geoda-core, geoda-algo y geoda-stats)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Modulo nativo `geoda._geoda`; el nombre evita chocar con `libgeoda` de `geoda-capi`.
name = "_geoda"
crate-type = ["cdylib"]

[dependencies]
geoda-algo = { path = "../../crates/algo" }
geoda-core = { path = "../../crates/core" }
geoda-stats = { path = "../../crates/stats" }
pyo3 = "0.30.1"

[lints]
workspace = true
