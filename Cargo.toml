[workspace]
resolver = "3"
members = ["crates/core", "crates/capi", "crates/algo", "crates/stats", "bindings/python", "bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ElYares/geoda"
# Ningun crate se publica en crates.io (decision 016, P3): quitar esto a proposito, por crate, al publicar.
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
