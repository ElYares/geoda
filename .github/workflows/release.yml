name: Release (construye paquetes, NO publica)

# Solo se dispara a mano. Construye la wheel de Python, los tarballs de npm (Node y WASM), el jar, el .wasm,
# las cabeceras de C++ y libgeoda.so, y los sube como artefactos de Actions con su SHA-256. No usa secretos
# ni tiene ningun paso de publicacion (decision 016): publicar es manual, ver RELEASING.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paquetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - run: pip install maturin
      - run: release/build.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paquetes-geoda
          path: dist/
          if-no-files-found: error
