name: Release (construye paquetes, NO publica)

# Solo se dispara a mano. Construye la wheel de Python, los tarballs de npm (Node y WASM), el jar, el .wasm,
# las cabeceras de C++ y libgeoda.so, y los sube como artefactos de Actions con su SHA-256. No usa secretos
# ni tiene ningun paso de publicacion (decision 016): publicar es manual, ver RELEASING.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paquetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - run: pip install maturin
      - run: release/build.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquetes-geoda
          path: dist/
          if-no-files-found: error
