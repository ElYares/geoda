name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # `geoda-py` necesita un interprete de Python: lo cubre el job `python`.
      - run: cargo clippy --workspace --exclude geoda-py --all-targets -- -D warnings
      - run: cargo test --workspace --exclude geoda-py
      - name: geoda-core sin dependencias
        run: test "$(cargo tree -p geoda-core --edges normal,build,dev --prefix none | wc -l)" -eq 1

  capi:
    # La C-API vista desde C: cabecera sin diff y smoke test (con ASan/UBSan/LSan).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Compilar cbindgen tarda ~1m30s: se cachea el binario por version.
      - uses: actions/cache@v4
        id: cbindgen
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}
      - if: steps.cbindgen.outputs.cache-hit != 'true'
        run: cargo install cbindgen --version 0.29.4 --locked
      - run: tests/c/run.sh
      - name: ABI congelada (lista de simbolos y version)
        run: abi/check.sh

  cpp:
    # El envoltorio C++17 de solo cabeceras (decision 015): g++ y clang++ con -Werror, ASan y UBSan.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p geoda-capi
      - name: cmake
        run: |
          cmake -S bindings/cpp -B build/cpp -DGEODA_LIB_DIR=$PWD/target/debug
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure
        env:
          CXX: ${{ matrix.cxx }}

  java:
    # El binding de Java con la API de memoria externa (FFM, JDK 22+): sin jextract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: cargo build -p geoda-capi
      - run: bindings/java/test.sh

  python:
    # El binding (PyO3 + maturin), el runner de spec por ctypes y el interop con
    # pyarrow. Falla si algun test de pyarrow se salta: aqui debe correr.
    runs-on: ubuntu-latest
    env:
      # `maturin develop` instala en este entorno virtual.
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pyarrow numpy
      - run: cargo build -p geoda-capi
      - name: binding
        working-directory: bindings/python
        run: |
          ../../.venv/bin/maturin develop
          ../../.venv/bin/python -c "import geoda; print(geoda.version()); assert geoda.column_len([1, None, 3]) == 3; assert geoda.median([3, 1, None, 2]) == 2.0"
      - run: cargo clippy -p geoda-py --all-targets -- -D warnings
      - name: runner de spec e interop
        working-directory: bindings/python
        run: |
          ../../.venv/bin/python -m unittest discover -s tests -v 2>&1 | tee out.txt
          ! grep -q skipped out.txt

  wheel:
    # Salida de la fase 2: construir la wheel, comprobar que no lleva rutas ni pruebas, instalarla
    # en un venv limpio (fuera del repo, sin PYTHONPATH) y correr el ejemplo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv "$RUNNER_TEMP/build"
      - run: "$RUNNER_TEMP/build/bin/pip install maturin"
      - name: construir la wheel
        run: PATH="$RUNNER_TEMP/build/bin:$PATH" bindings/python/build_wheel.sh "$RUNNER_TEMP/wheelhouse"
      - name: la wheel no lleva rutas de la maquina ni archivos de prueba
        run: |
          mkdir "$RUNNER_TEMP/contenido"
          cd "$RUNNER_TEMP/contenido"
          unzip -q "$RUNNER_TEMP"/wheelhouse/geoda-*.whl
          find . -type f | sort
          if find . -name __pycache__ -o -name '*.pyc' -o -name tests | grep -q .; then
            echo "la wheel lleva cache de bytecode o pruebas" >&2
            exit 1
          fi
          if grep -rlaF -e "$GITHUB_WORKSPACE" -e "$HOME" .; then
            echo "la wheel lleva rutas absolutas de esta maquina" >&2
            exit 1
          fi
      - name: instalar en un venv limpio y correr el ejemplo
        run: |
          python -m venv "$RUNNER_TEMP/limpio"
          "$RUNNER_TEMP/limpio/bin/pip" install "$RUNNER_TEMP"/wheelhouse/geoda-*.whl pyarrow
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/limpio/bin/python" -I -c "import geoda, importlib.metadata as m; assert geoda.version() == m.version('geoda'), (geoda.version(), m.version('geoda')); print('geoda', geoda.version(), geoda.__file__)"
          "$RUNNER_TEMP/limpio/bin/python" -I "$GITHUB_WORKSPACE/examples/estadisticas.py"

  miri:
    # Capas con unsafe: Miri detecta lecturas fuera de rango, desalineacion
    # y fugas en core::memory, core::interop y la capi. Necesita nightly; el resto del CI usa stable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: "cargo miri test -p geoda-core -- memory:: interop::"
      - run: cargo miri test -p geoda-capi --lib
